name: Validate website catalogs

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  catalog:
    name: Check catalog links against SneppX-Alg
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out website
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false
      - name: Check out core repository
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          repository: SneppX/sneppx-alg
          ref: main
          path: sneppx-alg
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c
        with:
          python-version: "3.11"
      - name: Validate JSON data
        run: python -c "import json; from pathlib import Path; [json.loads(p.read_text(encoding='utf-8')) for p in [Path('manifest.json'), Path('data/components.json'), Path('data/features.json')]]"
      - name: Check JavaScript syntax
        run: find . -name '*.js' -not -path './.git/*' -print0 | xargs -0 -n1 node --check
      - name: Run frontend behavior tests
        run: node --test tests/*.test.js
      - name: Install browser test tools
        run: npm install --global --no-audit --no-fund playwright@1.56.1 @axe-core/playwright@4.10.2
      - name: Expose global Node modules
        run: echo "NODE_PATH=$(npm root -g)" >> "$GITHUB_ENV"
      - name: Install Chromium
        run: playwright install --with-deps chromium
      - name: Start local website server
        run: |
          python -m http.server 4173 --bind 127.0.0.1 > /tmp/sneppxov-http.log 2>&1 &
          for attempt in $(seq 1 20); do
            if curl --fail --silent http://127.0.0.1:4173/ > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/sneppxov-http.log
          exit 1
      - name: Run browser and WCAG accessibility checks
        run: node tests/browser-smoke.cjs
      - name: Validate catalogs
        run: python scripts/validate_catalog.py --core sneppx-alg
